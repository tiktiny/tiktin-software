name: build-tiktin-pdf-a
on:
  push:
    branches: [version-a]
    paths: ['VERSION']      # בונים רק כשמספר הגרסה מתעדכן (הוא עולה אחרון)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build installer
        run: bash build/build.sh
      - name: Publish release (not latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 1p VERSION)
          gh release delete "v$VER" -y --cleanup-tag || true
          gh release create "v$VER" out/TiktinPDF-Setup.exe out/TiktinStamp-Setup.exe --target version-a --title "TIKTINPDF $VER" --notes "TIKTINPDF $VER — גרסה משרדית" --latest=false
      - name: Update permanent download links (release "downloads")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 1p VERSION)
          gh release view downloads >/dev/null 2>&1 || gh release create downloads --target version-a --title "הורדות קבועות – תוכנות טיקטין" --notes "קישורים קבועים: תמיד הגרסה העדכנית של כל תוכנה" --latest=false
          gh release upload downloads "out/TiktinPDF-Setup.exe#TIKTINPDF משרדית $VER" "out/TiktinPDF-Setup-A.exe#TIKTINPDF משרדית $VER" "out/TiktinStamp-Setup.exe#חותמת אוטומטית $VER" --clobber
